controller_server: 
  ros__parameters:
    # 当前实车控制器使用自定义 MincoMpc，不是下面被注释的 MPPI 配置。
    # MincoMpc 的输入路径为 /opt_path，里程计使用 Odin1 的 /odin1/odometry。
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.4 
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["MincoMpc"]  # 当前实际启用的控制器
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3 # 最小移动半径，用于判断是否需要重新计算路径
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 6.28
    # 备用 MPPI 配置：整段目前都是 YAML 注释，不会被加载，也不会启动 MPPI。
    # 如果以后切换到 MPPI，需要同时修改 controller_plugins，并重新核对底盘约束。
    # FollowPath:
    #   plugin: "nav2_mppi_controller::MPPIController"
    #   time_steps: 40 #是指在每个控制周期内，控制器将生成的轨迹点数。
    #   model_dt: 0.05  #是指控制器的时间步长，值越小，控制器越精确，但计算量也越大。
    #   batch_size: 800 #控制器的采样数。

    #   vx_std: 0.20 #控制器的线速度标准差, 用于生成随机噪声。复杂环境下，可以适当增大。
    #   vy_std: 0.20 #控制器的侧向速度标准差, 用于生成随机噪声。复杂环境下，可以适当增大。
    #   wz_std: 0.01
    #   vx_max: 2.0 #控制器的线速度最大值。
    #   vx_min: -2.0 #控制器的线速度最小值。
    #   vy_max: 2.0 #控制器的侧向速度最大值。
    #   wz_max: 0.0 #控制器的角速度最大值。

    #   ax_max: 2.0 #控制器的线加速度最大值。
    #   ax_min: -2.0 #控制器的线加速度最小值。
    #   ay_max: 2.0 #控制器的侧向加速度最大值。
    #   ay_min: -2.0 #控制器的侧向加速度最小值.
    #   az_max: 2.0 #控制器的角加速度最大值。

    #   iteration_count: 3 #控制器的迭代次数。
    #   prune_distance: 3.0 #控制器的轨迹剪枝距离。
    #   transform_tolerance: 0.05 #控制器的变换容忍度, 用于判断是否需要重新计算轨迹，值越大，越容易重新计算。
    #   temperature: 0.6 #控制器的温度。0.6是一个常用的值，用于控制控制器的探索能力。
    #   gamma: 0.03 #控制器的 gamma 值,
    #   motion_model: "Omni" #控制器的运动模型。
    #   visualize: true #是否可视化。
    #   reset_period: 0.1 # (only in Humble)
    #   retry_attempt_limit: 1 #软重置的尝试次数
    #   regenerate_noises: true

    #   TrajectoryVisualizer:
    #     trajectory_step: 10 #是指在可视化轨迹时，每隔多少个轨迹点绘制一个点。
    #     time_step: 5 #是指在可视化轨迹时，每隔多少个时间步长绘制一个点。

    #   AckermannConstraints:
    #     min_turning_r: 0.15
    #   critics: [ "ConstraintCritic", "CostCritic", "GoalCritic",  
    #        "PathAlignCritic", "PathFollowCritic","PreferForwardCritic" , "ObstaclesCritic"]

    #   ConstraintCritic: #交警，管你速度的
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 12.0 # 约束代价权重，提高会更关注约束,增大会导致路径更平滑
      
    #   GoalCritic:
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 15.0 # 代价权重，提高会更关注目标,增大更加迫切到终点，减小就对终点权重小了
    #     threshold_to_consider: 1.0 # 阈值内开始work
      

    #   ObstaclesCritic: #障碍物
    #     enabled: true
    #     cost_power: 1
    #     repulsion_weight: 8.0    # 推斥权重，数值越大越倾向于避开障碍物
    #     critical_weight: 8.0     # 关键权重，进入区域后加倍惩罚
    #     consider_footprint: true    # 是否考虑机器人外形轮廓
    #     collision_cost: 7000.0    # 碰撞代价，数值越大越避免碰撞
    #     collision_margin_distance: 0.10   # 实际车再多加一圈的距离
    #     near_goal_distance: 2.0  # 阈值以外正常工作，阈值内狠狠降低自己的效果，相当于允许近距离靠墙边停车
    #     inflation_radius: 0.2 # (only in Humble)
    #     cost_scaling_factor: 10.0 # (only in Humble)
      
    #   CostCritic: #代价，用于计算代价，代价越大，越不容易选择
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 3.0    #3.81中小数值，增大就更讨厌代价高的路径
    #     critical_cost: 200.0 #临界代价，路径代价高于该参数就不选这个路了
    #     consider_footprint: true
    #     collision_cost: 1000000.0 #碰撞代价
    #     near_goal_distance: 1.0  #于这个距离就允许贴近障碍物，设太大在离终点很远处就开始减速
    #     trajectory_point_step: 2 #轨迹点步长，写1就是每个点都查，计算量大精度高，写4就是4个点查一个。

    #   PathFollowCritic: #是否跟随路径
    #     enabled: true
    #     cost_power: 1
    #     cost_weight: 20.0 # 代价权重 越大，越关注路径跟随
    #     offset_from_furthest: 3 # 3小20大 。小则咬的死咬得死但容易跟着路径震荡。大则注意远方，容易转弯切内道
    #     threshold_to_consider: 0.4 # 小于阈值就不干活了，交给目标批评者

    # 当前启用的 MPC 控制器。
    # MincoMpc 负责跟踪 MincoPlanner 输出的 /opt_path；它不等于 Nav2 自带 MPPI。
    MincoMpc:
      plugin: "minco_controller::MincoMpcController"
      dt: 0.05
      lookahead_time: 0.5
      horizon: 10
      odom_frame: odom
      map_frame: map
      opt_path_topic: /opt_path
      odom_topic: /odin1/odometry
      vx_min: -2.0
      vx_max: 2.0
      vy_min: -2.0
      vy_max: 2.0
      # 当前配置禁止角速度输出；如果实车需要转向，必须结合底盘约束重新调整。
      omega_min: 0.0
      omega_max: 0.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      transform_tolerance: 1.0
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[ [0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3] ]" 
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 4    # 强度阈值，低于此值的点云不被认为是障碍物
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.2
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /terrain_map
          sensor_frame: odin1_base_link
          min_obstacle_height: 0.2
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.5
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      transform_tolerance: 1.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      footprint: "[ [0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3] ]" 
      resolution: 0.05 # 地图分辨率0.05米/像素（5cm）
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 4  # 增加标记阈值，减少噪声点被标记为障碍物
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.2  # 提高最小障碍高度，过滤地面噪声
        max_obstacle_height: 2.0  # 略微降低最大障碍高度，聚焦人体检测
        min_obstacle_intensity: 0.1  # 提高最小强度阈值，过滤弱反射噪声
        max_obstacle_intensity: 2.0  # 降低最大强度阈值，避免动态物体过强反射
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /terrain_map_ext
          sensor_frame: odin1_base_link
          min_obstacle_height: 0.2   # 提高最小障碍高度
          max_obstacle_height: 2.0   # 降低最大障碍高度
          obstacle_max_range: 5.0   # 缩短最大检测范围，减少远处噪声
          obstacle_min_range: 0.2   # 略微增加最小检测范围
          voxel_decay: 5.0         # 添加体素衰减参数，快速衰减动态物体的影响
          decay_acceleration: 2.0   # 衰减加速参数
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0        # 增大，代价衰减更快
        inflation_radius: 0.5       # 减小，膨胀区域更小
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

# Nav2 全局规划器服务器。
# 当前规划链路是：Nav2 目标点 → MincoPlanner → /opt_path → MincoMpc。
planner_server: #规划服务器
  ros__parameters:
    # 实车不使用仿真时钟。
    use_sim_time: False
    # 规划器期望的调用频率；实际频率还受地图查询和 MINCO 优化耗时影响。
    expected_planner_frequency: 20.0
    # 当前只启用自定义 MincoPlanner，不使用 Nav2 默认 GridBased planner。
    planner_plugins: ["MincoPlanner"]
    MincoPlanner:
      # MincoPlanner 插件的实现类。
      plugin: "minco_planner/MincoPlanner"
      # PRIORMAP：用 Nav2 的先验二维地图做全局搜索，再用 ROGMap 做局部边界和动态安全查询。
      # 另一种模式是 EXPLORATION，用于从 ROGMap 可达边界进行探索。
      planner_mode: PRIORMAP
      frames:
        # 先验栅格地图和 Nav2 目标使用的全局坐标系。
        map_frame: map
        # ROGMap、Odin 点云和 Odin 里程计所在的局部坐标系。
        rog_frame: odom
      priormap:
        # 是否使用 Nav2 的全局 costmap/地图搜索全局拓扑路径。
        use_nav2_global_search: true
        # 是否把全局搜索得到的路径种子裁剪到当前 ROGMap 可用边界内。
        clip_seed_by_rog_boundary: true
        # ROGMap 边界裁剪时向外保留的安全余量，单位米。
        rog_boundary_margin: 0.2
        # 沿 ROGMap 边界采样的步长，单位米；越小越精细、计算量越大。
        rog_boundary_sample_step: 0.1
      # 规划失败时允许目标点与路径终点之间的最大位置误差，单位米。
      tolerance: 0.3
      # 不使用 MincoPlanner 内部的 SMAC/A* 替代搜索分支。
      use_smac: false
      # 是否允许规划路径穿过未知区域；false 表示未知区域按不可通行处理。
      allow_unknown: false
      # Odin1 位姿输入；MincoPlanner 用它获得当前机器人在 odom 中的位置。
      odom_topic: /odin1/odometry
      # LiDAR/里程计参考点相对规划控制参考点的平面杆臂补偿，单位米。
      lidar_offset_x: 0.0
      lidar_offset_y: 0.0
      minco_optimizer:
        # MINCO 轨迹优化目标频率，单位 Hz。
        opt_freq: 20.0
        # 局部轨迹从全局路径向前截取的距离，单位米。
        lookahead_dist: 5.0
        # 轨迹到达目标时的位置容差，单位米。
        traj_goal_tolerance: 0.3
        # 轨迹优化允许的最大线速度，单位 m/s。
        max_velocity: 2.0
        # 轨迹优化允许的最大线加速度，单位 m/s²。
        max_acceleration: 2.0
        # 轨迹航向变化的最大速率约束，单位 rad/s。
        max_yaw_dot: 5.0
        # MINCO 优化阶段要求轨迹到障碍物的最小 ESDF 距离，单位米。
        # 该参数会影响优化代价和轨迹安全检查，不再依赖代码默认值。
        safe_dist: 0.10
        # A* 动态碰撞查询和轨迹安全检查使用的碰撞距离，单位米。
        collision_dist: 0.10
      rog_map:
        # MincoPlanner 内部维护的局部 ROGMap 配置。
        # 它直接订阅 Odin 点云和里程计；当前不再启动独立 odin_rog_map 节点。
        frame_id: odom
        # 体素分辨率，单位米；越小越精细，但更新开销越大。
        resolution: 0.10
        # 预处理节点已经做空间 Voxel 降采样，这里不再按输入顺序额外丢点。
        point_filt_num: 1
        # 障碍物膨胀使用的分辨率，单位米。
        inflation_resolution: 0.10
        # ROGMap 局部地图完整尺寸 [x, y, z]，单位米。
        map_size: [10.0, 3.0, 0.5]
        map_sliding:
          # 地图中心随机器人移动而滑动，避免固定局部地图很快失效。
          enable: true
          # 机器人距离当前地图中心超过该距离后触发滑动，单位米。
          threshold: 0.5
        ros_callback:
          # 开启 ROS 点云/里程计输入回调。
          enable: true
          # 由 odin_cloud_to_xyzi 完成字段转换、裁剪和 Voxel 降采样后的 XYZ-I 点云。
          cloud_topic: /odin1/cloud_slam_xyzi
          # Odin1 输出的里程计，用于给点云关联位姿。
          odom_topic: /odin1/odometry
          # 点云时间戳与最新里程计之间允许的最大差值，单位秒。
          odom_timeout: 0.3
          # ROGMap 内部更新调度周期，100 ms 对应目标 10 Hz。
          update_period_ms: 100
        raycasting:
          # 用点云命中和射线穿过信息更新占用/空闲体素。
          enable: true
          # 每次处理的输入帧数量。
          batch_update_size: 1
          # 点云命中体素的占用概率更新参数。
          p_hit: 0.70
          # 射线穿过体素的空闲概率更新参数。
          p_miss: 0.30
          # 射线更新的完整局部范围，单位米。
          local_update_box: [2.0, 0.5, 0.5]
          # 是否并行执行射线更新。
          parallel_enable: true
          # 射线更新线程数；过高会抢占 Odin 和 Nav2 的 CPU。
          num_threads: 4
        projection:
          # 将三维体素投影成规划器可查询的二维层。
          enable: true
          # 参与投影的垂直范围，单位米。
          scan_z_min_abs: -0.5
          scan_z_max_abs: 1.5
          # 未知体素是否在投影中当作障碍物。
          unknown_as_occupied: false
        esdf:
          # 是否维护 ESDF 距离场，供轨迹安全代价和边界查询使用。
          enable: true
          # ESDF 分辨率，单位米。
          resolution: 0.20
          # ESDF 每次更新的完整范围，单位米。
          local_update_box: [2.0, 0.5, 0.5]
        decay:
          # 动态障碍在一段时间未被观测后自动衰减。
          enable: true
          # 障碍至少保持的时间，单位秒。
          keep_time: 0.3
          # 障碍最长保留时间，单位秒；应大于 keep_time。
          clear_time: 2.0
        field:
          # MincoOptimizer 通过 ROGMap query() 使用距离场和梯度进行轨迹优化。
          # 必须开启，否则所有 ESDF 查询失败，MINCO 会直接返回 infinite cost。
          enable: true
        visualization:
          # 是否发布 ROGMap 可视化话题；当前关闭以减少调试输出开销。
          enable: false

smoother_server: #路径平滑服务器  
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 2000
      do_refinement: True
behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "drive_on_heading","backup", "assisted_teleop", "wait"]
    
    spin:
      plugin: "nav2_behaviors/Spin"
      
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
      service_name: "global_costmap/get_costmap" # 建议确认此处是用 global 还是 local
      max_radius: 2.0
      visualize: true                          # 开启可视化以便调试
      cost_threshold: 10.0                     # 关键：必须带 .0，确保它是 double 类型
      free_threshold: 10                       # 整数类型，代表最少需要的空闲像素点数量
      
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 2.0 
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    
waypoint_follower:    #路径点跟随器
  ros__parameters:
    use_sim_time: False
    loop_rate: 10 # 路径点跟随器循环频率10Hz
    stop_on_failure: false    # 任务失败时不停止，继续执行下一个点
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True    # 启用此功能
      waypoint_pause_duration: 10     # 在每个路径点暂停50毫秒

velocity_smoother:    #速度平滑器
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False    # 不缩放速度（保持原始输入）
    feedback: "OPEN_LOOP"
    max_velocity: [3.0, 3.0, 1.0]    #最大X、Y、旋转
    min_velocity: [-3.0, -3.0, -2.0]    #最小X、Y、旋转 
    max_accel: [3.0, 3.0, 4.0]    #最大加速度XY旋转
    max_decel: [-3.0, -3.0, -3.0]    #最小加速度XY旋转
    odom_topic: "/odin1/odometry"
    odom_duration: 0.1    # 里程计数据有效期0.1秒
    deadband_velocity: [0.0, 0.0, 0.0]    # 死区速度：无死区（立即响应）
    velocity_timeout: 1.0     # 速度指令超时时间1.0秒

pb_teleop_twist_joy_node: #手柄控制
  ros__parameters:
    use_sim_time: False
    robot_base_frame: gimbal_yaw
    control_mode: auto_control    # Option: auto_control, manual_control

    require_enable_button: true
    enable_button: 4              # L1 shoulder button
    enable_turbo_button: 5        # R1 shoulder button

    axis_chassis:
      x: 1                        # Left thumb stick vertical
      y: 0                        # Left thumb stick horizontal
      yaw: 6                      # button_left and button_right
    scale_chassis:
      x: 2.5
      y: 2.5
      yaw: 3.0
    scale_chassis_turbo:
      x: 4.0
      y: 4.0
      yaw: 6.0

    axis_gimbal:
      roll: -1                    # Disable
      pitch: 4                    # Right thumb stick vertical
      yaw: 3                      # Right thumb stick horizontal
    scale_gimbal:
      roll: 0.0
      pitch: -1.0
      yaw: 2.5
    scale_gimbal_turbo:
      roll: 0.0
      pitch: -1.5
      yaw: 3.5
